   text-shadow:0 0 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 5px 0 #000,0 -4px 0 #000,4px 0 0 #000,-4px 0 0 #000,0 8px 18px rgba(0,0,0,.6);}
 /* shorts: legenda pequena, minúscula, 2-3 palavras, uma em amarelo (estilo dos shorts de Roblox) */
 #stage.short #cap{left:60px;right:60px;bottom:auto;top:1130px;font-size:62px;font-weight:800;text-transform:none;letter-spacing:0;

 .chip.gold{background:rgba(40,30,10,.85);border:3px solid #e7b13a;color:#f6c545}
 .chip.blue{background:rgba(10,30,55,.85);border:3px solid #4aa3ff;color:#9fd0ff}
 .chip.red{background:rgba(60,10,10,.88);border:3px solid #ff4b3e;color:#ff8a80}
 .chip.green{background:rgba(8,45,20,.88);border:3px solid #3ddc6a;color:#8dffac}
 .chip.white{background:rgba(255,255,255,.92);border:3px solid #111;color:#111}
 .abs{position:absolute}
